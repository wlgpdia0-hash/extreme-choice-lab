<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>페이지를 찾을 수 없습니다</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
          Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
      }
      
      .container {
        background: white;
        border-radius: 20px;
        padding: 60px 40px;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
        margin: 20px;
      }
      
      .error-code {
        font-size: 120px;
        font-weight: 900;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin: 0;
      }
      
      h1 {
        font-size: 28px;
        margin: 20px 0 10px 0;
        color: #333;
      }
      
      p {
        font-size: 16px;
        color: #666;
        margin-bottom: 30px;
        line-height: 1.6;
      }
      
      .buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }
      
      .btn {
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }
      
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }
      
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }
      
      .btn-secondary {
        background: #f0f0f0;
        color: #333;
      }
      
      .btn-secondary:hover {
        background: #e0e0e0;
        transform: translateY(-2px);
      }
      
      .emoji {
        font-size: 80px;
        margin-bottom: 20px;
      }
      
      @media (max-width: 640px) {
        .container {
          padding: 40px 20px;
        }
        
        .error-code {
          font-size: 80px;
        }
        
        h1 {
          font-size: 24px;
        }
        
        p {
          font-size: 14px;
        }
        
        .buttons {
          flex-direction: column;
        }
        
        .btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="emoji">🔍</div>
      <p class="error-code">404</p>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>요청하신 페이지를 찾을 수 없습니다. 다시 한번 확인해주세요.</p>
      <div class="buttons">
        <button class="btn btn-primary" onclick="window.location.href='/'">홈으로 이동</button>
        <button class="btn btn-secondary" onclick="window.history.back()">이전 페이지</button>
      </div>
    </div>
    
    <script>
      // SPA인 경우 index.html로 리다이렉트
      window.location.href = '/';
    </script>
  </body>
</html>
